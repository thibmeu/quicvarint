name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Ensure we have main branch for benchmarking

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

  benchmark:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Benchmark main
        # ponytail: keep both native tables in one job; add persisted results only if CI must enforce a threshold.
        run: |
          git checkout main -- src
          npm run bench -- --run

      - name: Restore PR implementation
        run: git restore --source=HEAD --staged --worktree src

      - name: Benchmark PR
        run: npm run bench -- --run
